<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOSED - Skill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .skill-page {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray-500);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .back-link:hover {
      color: var(--fg);
    }

    .skill-header {
      margin-bottom: 32px;
    }

    .skill-title {
      font-size: 32px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 8px;
    }

    .skill-source {
      color: var(--gray-500);
      font-size: 14px;
    }

    .skill-desc {
      color: var(--gray-400);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--gray-800);
    }

    .install-section {
      margin-bottom: 32px;
    }

    .install-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--gray-500);
      margin-bottom: 12px;
    }

    .install-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: 6px;
      padding: 14px 18px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .install-box:hover {
      border-color: var(--gray-600);
    }

    .install-prompt {
      color: var(--gray-500);
    }

    .install-cmd {
      color: var(--fg);
      font-size: 14px;
      flex: 1;
    }

    .install-copy {
      color: var(--gray-500);
    }

    .skill-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding: 24px 0;
      border-top: 1px solid var(--gray-800);
      border-bottom: 1px solid var(--gray-800);
      margin-bottom: 32px;
    }

    .meta-item {
      text-align: center;
    }

    .meta-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--fg);
    }

    .meta-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--gray-500);
      margin-top: 4px;
    }

    .skill-content {
      color: var(--gray-400);
      line-height: 1.8;
    }

    .skill-content h2 {
      color: var(--fg);
      font-size: 18px;
      margin: 32px 0 16px;
    }

    .skill-content ul {
      margin-left: 20px;
    }

    .skill-content li {
      margin-bottom: 8px;
    }

    .skill-content code {
      background: var(--gray-900);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="header-logo">
        <svg height="18" viewBox="0 0 76 65" fill="currentColor">
          <path d="M37.5274 0L75.0548 65H0L37.5274 0Z"></path>
        </svg>
      </a>
      <span class="header-sep">/</span>
      <a href="/" class="header-brand">DOSED</a>
    </div>
    <div class="header-right">
      <a href="https://github.com/KrishnaShettyDev/dosed">Docs</a>
    </div>
  </header>

  <main class="skill-page">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to skills
    </a>

    <div class="skill-header">
      <h1 class="skill-title" id="skill-title">Loading...</h1>
      <p class="skill-source">KrishnaShettyDev/dosed</p>
    </div>

    <p class="skill-desc" id="skill-desc"></p>

    <div class="install-section">
      <p class="install-label">INSTALL</p>
      <div class="install-box" onclick="copyInstall()">
        <span class="install-prompt">$</span>
        <code class="install-cmd" id="install-cmd">npx skills add KrishnaShettyDev/dosed</code>
        <svg class="install-copy" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="14" height="14" x="8" y="8" rx="2"/>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
      </div>
    </div>

    <div class="skill-meta">
      <div class="meta-item">
        <div class="meta-value" id="skill-type">-</div>
        <div class="meta-label">TYPE</div>
      </div>
      <div class="meta-item">
        <div class="meta-value">v1.0</div>
        <div class="meta-label">VERSION</div>
      </div>
      <div class="meta-item">
        <div class="meta-value">MIT</div>
        <div class="meta-label">LICENSE</div>
      </div>
    </div>

    <div class="skill-content" id="skill-content"></div>
  </main>

  <div class="toast" id="toast">Copied!</div>

      },
      '2cb': {
        name: '2cb',
        type: 'psychedelic',
        desc: 'Sensory enhancement, tactile pleasure, playful, mentally clear',
        content: `<h2>Key Cognitive Modifications</h2><ul><li>Sensory enhancement</li><li>Tactile pleasure</li><li>Playfulness</li><li>Mental clarity</li></ul>`
      },
      ghb: {
        name: 'ghb',
        type: 'depressant',
        desc: 'Euphoria, social warmth, disinhibition, narrow dosing window',
        content: `<h2>Key Cognitive Modifications</h2><ul><li>Euphoria</li><li>Social warmth</li><li>Disinhibition</li><li>Narrow dosing window</li></ul>`
      },
      nitrous: {
        name: 'nitrous',
        type: 'dissociative',
        desc: 'Brief revelation, immediate amnesia, giggles, wah-wah',
        content: `<h2>Key Cognitive Modifications</h2><ul><li>Brief revelation</li><li>Immediate amnesia</li><li>Giggles</li><li>Wah-wah effect</li></ul>`
      },
      mescaline: {
        name: 'mescaline',
        type: 'psychedelic',
        desc: 'Visual beauty, sacred geometry, earth connection, slow onset',
        content: `<h2>Key Cognitive Modifications</h2><ul><li>Visual beauty</li><li>Sacred geometry</li><li>Earth connection</li><li>Slow onset</li></ul>`
      }
    };

    // Get skill from URL
    const params = new URLSearchParams(window.location.search);
    const skillId = params.get('s');
    const skill = skills[skillId];

    if (skill) {
      document.title = `DOSED - ${skill.name}`;
      document.getElementById('skill-title').textContent = skill.name;
      document.getElementById('skill-desc').textContent = skill.desc;
      document.getElementById('skill-type').textContent = skill.type;
      document.getElementById('install-cmd').textContent = `npx skills add KrishnaShettyDev/dosed --skill ${skill.name}`;
      document.getElementById('skill-content').innerHTML = skill.content;
    } else {
      document.getElementById('skill-title').textContent = 'Skill not found';
      document.getElementById('skill-desc').textContent = 'This skill does not exist.';
    }

    function copyInstall() {
      const cmd = document.getElementById('install-cmd').textContent;
      navigator.clipboard.writeText(cmd);
      showToast();
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
